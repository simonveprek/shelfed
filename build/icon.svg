<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfcfa"/><stop offset="1" stop-color="#e9e5dc"/></linearGradient>
    <linearGradient id="lean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4bff"/><stop offset="0.3333333333333333" stop-color="#a23bff"/><stop offset="0.6666666666666666" stop-color="#ff2d55"/><stop offset="1" stop-color="#ffb020"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2622" stop-opacity="0.94"/><stop offset="1" stop-color="#121010" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/><stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.04"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a1208" flood-opacity="0.3"/>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="74.16"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="33"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10.5"/></filter>
    <filter id="hair" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.7999999999999998"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#drop)"/>
  <g clip-path="url(#clip)">
    <circle cx="759.2" cy="759.2" r="313.12" fill="#ff2d55" opacity="0.2" filter="url(#haze)"/><circle cx="264.8" cy="248.32" r="280.16" fill="#2b4bff" opacity="0.12" filter="url(#haze)"/>
    <!-- The reading spine lights the tile around it. -->
    <rect x="627.5" y="422" width="105" height="285" rx="45" fill="url(#lean)" opacity="0.45" filter="url(#glow)" transform="rotate(-16 627.5 707)"/>
    <ellipse cx="512" cy="100" rx="510.88" ry="346.08" fill="url(#sheen)"/>
    <g >
      <rect x="309.5" y="330.5" width="105" height="390" rx="45" fill="#000" opacity="0.18" filter="url(#soft)"/>
      <rect x="309.5" y="317" width="105" height="390" rx="45" fill="url(#body)"/>
      <rect x="309.5" y="317" width="105" height="390" rx="45" fill="url(#depth)"/>
      <rect x="311" y="318.5" width="102" height="387" rx="43.5" fill="none" stroke="url(#rim)" stroke-width="3.3"/>
      <rect x="330.5" y="340.1" width="21" height="195" rx="10.5" fill="url(#shine)" filter="url(#hair)"/>
    </g><g >
      <rect x="444.5" y="405.5" width="105" height="315" rx="45" fill="#000" opacity="0.18" filter="url(#soft)"/>
      <rect x="444.5" y="392" width="105" height="315" rx="45" fill="url(#body)"/>
      <rect x="444.5" y="392" width="105" height="315" rx="45" fill="url(#depth)"/>
      <rect x="446" y="393.5" width="102" height="312" rx="43.5" fill="none" stroke="url(#rim)" stroke-width="3.3"/>
      <rect x="465.5" y="415.1" width="21" height="157.5" rx="10.5" fill="url(#shine)" filter="url(#hair)"/>
    </g>
    <g transform="rotate(-16 627.5 707)">
      <rect x="627.5" y="435.5" width="105" height="285" rx="45" fill="#000" opacity="0.18" filter="url(#soft)"/>
      <rect x="627.5" y="422" width="105" height="285" rx="45" fill="url(#lean)"/>
      <rect x="627.5" y="422" width="105" height="285" rx="45" fill="url(#depth)"/>
      <rect x="629" y="423.5" width="102" height="282" rx="43.5" fill="none" stroke="url(#rim)" stroke-width="3.3"/>
      <rect x="648.5" y="445.1" width="21" height="142.5" rx="10.5" fill="url(#shine)" filter="url(#hair)"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
