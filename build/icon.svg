<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4bff"/>
      <stop offset="0.33" stop-color="#a23bff"/>
      <stop offset="0.67" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f0eee8"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3c2c16" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- The tile, on the macOS icon grid, in the kit's paper. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)" filter="url(#drop)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#2e2414" stroke-opacity="0.08"/>
  <!-- The mark, on the Fragms 32 grid. Two plain spines and one alive, leaning. -->
  <g transform="translate(272 272) scale(15)">
    <rect x="2.5" y="3" width="7" height="26" rx="3" fill="#1d1b18"/>
    <rect x="11.5" y="8" width="7" height="21" rx="3" fill="#1d1b18"/>
    <rect x="23.7" y="10" width="7" height="19" rx="3" fill="url(#aurora)" transform="rotate(-16 23.7 29)"/>
  </g>
</svg>
