<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Book pages are shown in frames made from blob: addresses, and those
      frames take this policy as their own. With no inline or blob: scripts
      allowed, nothing a book carries can run. Development swaps in a looser
      policy for Vite, in electron.vite.config.ts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' shelf: blob: data: https:; font-src 'self' blob: data:; connect-src 'self' shelf: blob: data:; frame-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Shelfed</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
