name: Something's wrong
description: Shelf did something it shouldn't, or didn't do something it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Shelf did instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shelf version
      placeholder: "0.1.0"
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [macOS, Windows 11, Windows 10, Linux]
    validations:
      required: true
  - type: input
    id: kindle
    attributes:
      label: Kindle, if it's about one
      placeholder: Kindle Paperwhite (12th gen)
