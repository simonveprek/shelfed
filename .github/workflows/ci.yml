name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Drives the built app: adding books, menus, views, the reader, settings.
      # Linux runners have no screen, so it gets a virtual one.
      - name: App tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-tests-${{ matrix.os }}
          path: |
            playwright-report
            test-results
      # Packs the app without an installer, to catch packaging problems on each system.
      - if: runner.os != 'Linux'
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
