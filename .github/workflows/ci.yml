name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Known holes in anything the app ships with.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Drives the built app: adding books, menus, views, the reader, settings.
      # Linux runners have no screen, so it gets a virtual one.
      - name: App tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}npx playwright test
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-tests-${{ matrix.os }}
          path: |
            playwright-report
            test-results
      # Packs the app without an installer, to catch packaging problems on each system.
      - if: runner.os != 'Linux'
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # The packed app has to hold what it should, and with its lockdown on, actually start.
      - if: runner.os != 'Linux'
        run: node scripts/package-check.mjs
      - if: runner.os != 'Linux'
        run: node scripts/launch-check.mjs
