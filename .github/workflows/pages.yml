name: Site

# Builds the site in site/ with Next.js and publishes it to GitHub Pages
# whenever it changes on main, if the site lives there (see below). Netlify
# uses netlify.toml instead.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only when the site is hosted on GitHub Pages rather than Netlify: turn Pages
    # on in the repository settings and set the variable SITE_ON_PAGES to true.
    if: ${{ vars.SITE_ON_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      # Served at its own address, so no base path.
      - run: npm run build --prefix site
        env:
          SITE_URL: https://shelfed.simonveprek.cz
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/out
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
