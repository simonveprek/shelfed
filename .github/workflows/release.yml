name: Release

# Push a tag like v0.2.0 to build installers into a draft release, then publish
# the release on GitHub when it looks right.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The draft release, made once before the builds start. Three builds that each
  # made their own at the same moment could leave three drafts.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Draft the release, unless it's already there
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Shelfed ${TAG#v}" --notes-file build/release-notes.md

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, args: --mac --arm64 --x64 }
          # Windows on ARM runs this one too, as x64.
          - { name: Windows, os: windows-latest, arch: x64, args: --win --x64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - if: runner.os == 'Windows'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/installer/go.mod
          cache-dependency-path: tools/installer/go.sum
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned for now. Add CSC_LINK and CSC_KEY_PASSWORD secrets to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # What's going out has to hold what it should and actually start. A red run here means don't publish the draft.
      - run: node scripts/package-check.mjs
      - run: node scripts/launch-check.mjs
      # The installer people download on Windows: Shelfed's own window around the
      # one above, which updates keep using on their own.
      - if: runner.os == 'Windows'
        run: node scripts/win-installer.mjs ${{ matrix.arch }}
      - if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/Shelfed-*-win-${{ matrix.arch }}.exe --clobber
