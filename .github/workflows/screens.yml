name: Screens

# A picture of every screen on Windows, to check how Shelfed looks there.
# Run it from the Actions tab, or: gh workflow run screens.yml
on:
  workflow_dispatch:

jobs:
  screens:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test e2e/screens.spec.ts
        env:
          SHELF_SCREENS: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.os }}
          path: screens
