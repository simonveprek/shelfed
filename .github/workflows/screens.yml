name: Screens

# A picture of every screen on Windows, to check how Shelfed looks there, and
# of the installer at work.
# Run it from the Actions tab, or: gh workflow run screens.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screens:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test e2e/screens.spec.ts
        env:
          SHELF_SCREENS: "1"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screens-${{ matrix.os }}
          path: screens

  # The installer itself: what it shows, and that it starts no console windows.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/installer/go.mod
          cache-dependency-path: tools/installer/go.sum
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: node scripts/win-installer.mjs x64
      - run: ./scripts/installer-check.ps1
        shell: pwsh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screens-installer
          path: screens/installer
      # The installer itself, to try on a PC.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-win-x64
          path: dist/Shelfed-*-win-x64.exe

