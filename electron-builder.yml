appId: cz.simonveprek.shelf
productName: Shelfed
copyright: Copyright © 2026 Šimon Vepřek
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# The AZW3 converter, built from tools/azw3, read from process.resourcesPath.
extraResources:
  - from: resources/azw3.wasm
    to: azw3.wasm
extraFiles:
  - LICENSE
  - LICENSE-FRAGMS-PERSONAL.md
  - THIRD_PARTY_NOTICES.md
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
fileAssociations:
  - ext: [epub, mobi, azw3, azw, prc, fb2, fbz, cbz, pdf]
    name: E-book
    description: E-book
    role: Viewer
mac:
  category: public.app-category.books
  target:
    - target: dmg
      arch: [arm64, x64]
  darkModeSupport: true
  icon: build/icon.png
win:
  # The release builds x64 and arm64 one at a time, so each installer holds only its own app.
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shelfed
  license: LICENSE
publish:
  provider: github
  owner: simonveprek
  repo: shelfed
  releaseType: draft
